<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/html/layout :: page(~{::content})}">
  <body>
    <th:block th:fragment="content">
      <th:block th:replace="~{mail/html/parts :: eyebrow(#{mail.welcome.eyebrow})}" />
      <th:block th:replace="~{mail/html/parts :: heading(#{mail.welcome.title})}" />
      <th:block th:replace="~{mail/html/parts :: paragraph(#{mail.welcome.body(${name})})}" />
      <th:block th:replace="~{mail/html/parts :: button(${link}, #{mail.welcome.action})}" />
      <th:block th:replace="~{mail/html/parts :: rule}" />

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 12px 0 0">
        <th:block th:replace="~{mail/html/parts :: fact('01', #{mail.welcome.step1})}" />
        <th:block th:replace="~{mail/html/parts :: fact('02', #{mail.welcome.step2})}" />
        <th:block th:replace="~{mail/html/parts :: fact('03', #{mail.welcome.step3})}" />
      </table>
    </th:block>
  </body>
</html>
