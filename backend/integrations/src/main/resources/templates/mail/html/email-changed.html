<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/html/layout :: page(~{::content})}">
  <body>
    <th:block th:fragment="content">
      <th:block th:replace="~{mail/html/parts :: eyebrow(#{mail.emailChanged.eyebrow})}" />
      <th:block th:replace="~{mail/html/parts :: heading(#{mail.emailChanged.title})}" />
      <th:block th:replace="~{mail/html/parts :: paragraph(#{mail.emailChanged.body(${name})})}" />
      <th:block th:replace="~{mail/html/parts :: button(${link}, #{mail.emailChanged.action})}" />
      <th:block th:replace="~{mail/html/parts :: rule}" />

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 12px 0 0">
        <th:block th:replace="~{mail/html/parts :: fact(#{mail.emailChanged.newAddress}, ${newEmail})}" />
        <th:block th:replace="~{mail/html/parts :: fact(#{mail.emailChanged.when}, ${changedAt})}" />
      </table>

      <th:block th:replace="~{mail/html/parts :: note(#{mail.emailChanged.note})}" />
    </th:block>
  </body>
</html>
