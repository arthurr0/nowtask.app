<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(content)" th:lang="${#locale.language}" lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title th:text="${subject}">nowtask</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      table {
        border-collapse: collapse;
      }

      img {
        border: 0;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }

      a {
        color: #55585f;
      }

      .dark-only {
        display: none !important;
        mso-hide: all;
        max-height: 0;
        overflow: hidden;
      }

      @media only screen and (max-width: 620px) {
        .shell {
          width: 100% !important;
        }

        .pad {
          padding: 26px 22px 24px !important;
        }

        .outer {
          padding: 22px 12px !important;
        }
      }

      @media (prefers-color-scheme: dark) {
        .light-only {
          display: none !important;
          mso-hide: all;
          max-height: 0;
          overflow: hidden;
        }

        .dark-only {
          display: block !important;
          max-height: none !important;
          overflow: visible !important;
        }

        body,
        .canvas,
        .outer {
          background-color: #0d0e10 !important;
        }

        .card {
          background-color: #161719 !important;
          border-color: #2d2e31 !important;
        }

        .title,
        .value {
          color: #ecedef !important;
        }

        .body {
          color: #9d9fa2 !important;
        }

        .muted,
        .muted a {
          color: #737578 !important;
        }

        .rule {
          background-color: #2d2e31 !important;
        }

        .action {
          background-color: #ecedef !important;
        }

        .action a {
          color: #0d0e10 !important;
        }

        .panel {
          background-color: #1e1f21 !important;
          border-color: #2d2e31 !important;
        }
      }
    </style>
  </head>

  <body class="canvas" style="margin: 0; padding: 0; background-color: #f9fafb">
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        color: transparent;
        font-size: 1px;
        line-height: 1px;
      "
      th:text="${preheader}"
    ></div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="canvas" style="background-color: #f9fafb">
      <tr>
        <td align="center" class="outer" style="padding: 34px 16px 40px">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" class="shell" style="width: 600px; max-width: 600px">
            <tr>
              <td style="padding: 0 2px 20px">
                <a th:href="${appUrl}" style="text-decoration: none">
                  <img
                    class="light-only"
                    th:src="'cid:logo-light'"
                    width="122"
                    height="28"
                    alt="nowtask"
                    style="display: block; width: 122px; height: 28px"
                  />
                  <img
                    class="dark-only"
                    th:src="'cid:logo-dark'"
                    width="122"
                    height="28"
                    alt="nowtask"
                    style="width: 122px; height: 28px"
                  />
                </a>
              </td>
            </tr>

            <tr>
              <td
                class="card"
                style="background-color: #ffffff; border: 1px solid #dee0e3; border-radius: 10px"
              >
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      class="pad"
                      style="
                        padding: 34px 34px 30px;
                        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                          Helvetica, Arial, sans-serif;
                      "
                    >
                      <th:block th:replace="${content}" />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td
                class="muted"
                style="
                  padding: 22px 4px 0;
                  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    Helvetica, Arial, sans-serif;
                  font-size: 12px;
                  line-height: 1.7;
                  color: #8c8e91;
                "
              >
                <span th:text="#{mail.footer.tagline}">Now, not someday.</span><br />
                <a
                  th:href="${appUrl}"
                  th:text="${#strings.replace(#strings.replace(appUrl, 'https://', ''), 'http://', '')}"
                  style="color: #8c8e91; text-decoration: underline"
                  >nowtask.app</a
                >
                <span style="padding: 0 4px">&middot;</span>
                <span th:text="#{mail.footer.transactional}">Automatic message.</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
