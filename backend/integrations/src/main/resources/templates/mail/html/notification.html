<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/html/layout :: page(~{::content})}">
  <body>
    <th:block th:fragment="content">
      <th:block th:replace="~{mail/html/parts :: eyebrow(#{mail.notification.eyebrow})}" />
      <th:block th:replace="~{mail/html/parts :: heading(${title})}" />
      <th:block th:replace="~{mail/html/parts :: quote(${message})}" />
      <th:block th:if="${link}">
        <th:block th:replace="~{mail/html/parts :: button(${link}, #{mail.notification.action})}" />
      </th:block>
      <th:block th:replace="~{mail/html/parts :: rule}" />

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 12px 0 0">
        <th:block th:replace="~{mail/html/parts :: fact(#{mail.notification.event}, ${event})}" />
        <th:block th:if="${taskKey}">
          <th:block th:replace="~{mail/html/parts :: fact(#{mail.notification.task}, ${taskKey})}" />
          <th:block th:if="${taskTitle}">
            <th:block th:replace="~{mail/html/parts :: fact(#{mail.notification.taskTitle}, ${taskTitle})}" />
          </th:block>
        </th:block>
      </table>

      <th:block th:replace="~{mail/html/parts :: note(#{mail.notification.note})}" />
    </th:block>
  </body>
</html>
