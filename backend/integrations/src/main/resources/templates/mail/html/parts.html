<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div
      th:fragment="eyebrow(text)"
      class="muted"
      style="
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.4;
        letter-spacing: 0.04em;
        color: #8c8e91;
      "
      th:text="${text}"
    ></div>

    <h1
      th:fragment="heading(text)"
      class="title"
      style="
        margin: 12px 0 0;
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        font-size: 21px;
        line-height: 1.32;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: #1d1f23;
      "
      th:text="${text}"
    ></h1>

    <p
      th:fragment="paragraph(text)"
      class="body"
      style="
        margin: 14px 0 0;
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        font-size: 14px;
        line-height: 1.7;
        color: #616367;
      "
      th:text="${text}"
    ></p>

    <table
      th:fragment="button(url, label)"
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      style="margin: 26px 0 0"
    >
      <tr>
        <td class="action" style="background-color: #1d1f23; border-radius: 9px">
          <a
            th:href="${url}"
            th:text="${label}"
            style="
              display: inline-block;
              padding: 13px 24px;
              font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
                Arial, sans-serif;
              font-size: 14px;
              font-weight: 500;
              line-height: 1;
              color: #f9fafb;
              text-decoration: none;
            "
          ></a>
        </td>
      </tr>
    </table>

    <p
      th:fragment="fallback(url)"
      class="muted"
      style="
        margin: 18px 0 0;
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.65;
        color: #8c8e91;
        word-break: break-all;
      "
    >
      <span th:text="#{mail.common.fallback}">If the button does not work, paste this address into the browser:</span
      ><br />
      <a th:href="${url}" th:text="${url}" style="color: #8c8e91; text-decoration: underline"></a>
    </p>

    <div
      th:fragment="rule"
      class="rule"
      style="height: 1px; line-height: 1px; font-size: 0; margin: 26px 0 0; background-color: #dee0e3"
    >
      &nbsp;
    </div>

    <tr th:fragment="fact(label, value)">
      <td
        class="muted"
        style="
          padding: 7px 14px 0 0;
          vertical-align: top;
          white-space: nowrap;
          font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 11px;
          line-height: 1.7;
          color: #8c8e91;
        "
        th:text="${label}"
      ></td>
      <td
        class="value"
        style="
          padding: 7px 0 0;
          vertical-align: top;
          font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
            sans-serif;
          font-size: 13px;
          line-height: 1.7;
          color: #1d1f23;
        "
        th:text="${value}"
      ></td>
    </tr>

    <div
      th:fragment="note(text)"
      class="panel body"
      style="
        margin: 26px 0 0;
        padding: 14px 16px;
        background-color: #f3f4f6;
        border: 1px solid #dee0e3;
        border-radius: 9px;
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        font-size: 12.5px;
        line-height: 1.65;
        color: #616367;
      "
      th:text="${text}"
    ></div>

    <div
      th:fragment="quote(text)"
      class="panel value"
      style="
        margin: 22px 0 0;
        padding: 16px 18px;
        background-color: #f3f4f6;
        border: 1px solid #dee0e3;
        border-radius: 9px;
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        font-size: 13.5px;
        line-height: 1.7;
        color: #1d1f23;
        white-space: pre-line;
      "
      th:text="${text}"
    ></div>
  </body>
</html>
