server:
  port: 8081

spring:
  application:
    name: nowtask
  datasource:
    url: ${NOWTASK_DB_URL:jdbc:postgresql://localhost:5433/nowtask}
    username: ${NOWTASK_DB_USER:nowtask}
    password: ${NOWTASK_DB_PASSWORD:nowtask}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${NOWTASK_MAIL_HOST:}
    port: ${NOWTASK_MAIL_PORT:1025}
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    ignore-migration-patterns: '*:missing'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nowtask:
  version: 0.1.0-SNAPSHOT
  mail:
    from: ${NOWTASK_MAIL_FROM:nowtask@localhost}
