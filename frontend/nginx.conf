server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Files with a fingerprint in the name can stay in the cache indefinitely.
  location ~* \.(?:js|css|woff2|png|svg|jpg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /api/events {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $kadra_events backend;
    proxy_pass http://$kadra_events:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Strumien SSE zyje dlugo i musi plynac bez buforowania.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    # The backend address is resolved per request rather than at startup, so that the frontend
    # container comes up regardless of whether the backend is already running.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $kadra_backend backend;
    proxy_pass http://$kadra_backend:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serwer MCP dla agentow AI. Klient przynosi wlasny klucz w naglowku Authorization,
  # wiec pod tym adresem nie ma zadnego wspoldzielonego sekretu.
  location /mcp {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $kadra_mcp mcp;
    proxy_pass http://$kadra_mcp:8765;
    proxy_http_version 1.1;
    # Serwer MCP sprawdza naglowek Host pod katem DNS rebinding, wiec podajemy mu
    # adres, pod ktorym sam siebie zna, zamiast publicznej domeny instancji.
    proxy_set_header Host mcp:8765;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Streamable HTTP trzyma otwarty strumien odpowiedzi, wiec bez buforowania.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
