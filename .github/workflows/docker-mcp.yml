name: Docker mcp

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'mcp/**'
      - '.github/workflows/docker-mcp.yml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/docker-mcp.yml'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

concurrency:
  group: docker-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      image: nowtask-mcp
      context: ./mcp
