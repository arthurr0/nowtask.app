name: Docker mcp

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - development
    paths:
      - 'mcp/**'
      - '.github/workflows/docker-mcp.yml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches:
      - master
      - development
    paths:
      - 'mcp/**'
      - '.github/workflows/docker-mcp.yml'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: nowtask-app-mcp
      context: ./mcp
    secrets: inherit
