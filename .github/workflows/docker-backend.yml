name: Docker backend

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-backend.yml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/docker-backend.yml'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      image: nowtask-backend
      context: ./backend
