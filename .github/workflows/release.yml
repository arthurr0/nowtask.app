name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      image: nowtask-backend
      context: ./backend

  frontend:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      image: nowtask-frontend
      context: ./frontend

  mcp:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      image: nowtask-mcp
      context: ./mcp

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - mcp
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract the changelog section
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          append_body: true
          body: |
            Container images on the GitHub Container Registry, tagged `${{ github.ref_name }}` and `latest`:

            - `ghcr.io/${{ github.repository_owner }}/nowtask-backend`
            - `ghcr.io/${{ github.repository_owner }}/nowtask-frontend`
            - `ghcr.io/${{ github.repository_owner }}/nowtask-mcp`

            Run this version with `IMAGE_TAG=${{ github.ref_name }} docker compose -f docker-compose.prod.yml up -d`.
