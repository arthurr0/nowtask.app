name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: nowtask-app-backend
      context: ./backend
    secrets: inherit

  frontend:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: nowtask-app-frontend
      context: ./frontend
    secrets: inherit

  mcp:
    uses: ./.github/workflows/docker-publish.yml
    with:
      image: nowtask-app-mcp
      context: ./mcp
    secrets: inherit

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - mcp
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Obrazy w Artifact Registry (`${{ github.ref_name }}` oraz `latest`):

            - `europe-central2-docker.pkg.dev/minecodes/minecodes/nowtask-app-backend:${{ github.ref_name }}`
            - `europe-central2-docker.pkg.dev/minecodes/minecodes/nowtask-app-frontend:${{ github.ref_name }}`
            - `europe-central2-docker.pkg.dev/minecodes/minecodes/nowtask-app-mcp:${{ github.ref_name }}`

            Uruchomienie: `IMAGE_TAG=${{ github.ref_name }} docker compose -f docker-compose.prod.yml up -d`
