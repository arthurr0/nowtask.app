name: Docker frontend

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/docker-frontend.yml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/docker-frontend.yml'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

concurrency:
  group: docker-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      image: nowtask-frontend
      context: ./frontend
