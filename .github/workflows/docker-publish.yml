name: Docker publish

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: true
        type: string
    secrets:
      GCP_SA_KEY:
        required: false

permissions:
  contents: read

env:
  ARTIFACT_REGISTRY: europe-central2-docker.pkg.dev
  REPOSITORY: europe-central2-docker.pkg.dev/minecodes/minecodes

jobs:
  publish:
    name: ${{ inputs.image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authorize GCP
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 363.0.0'

      - name: Configure Docker authentication
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker "$ARTIFACT_REGISTRY" --quiet

      - name: Resolve tags
        id: meta
        run: |
          REPO="$REPOSITORY/${{ inputs.image }}"
          TAGS="$REPO:$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$REPO:${{ github.ref_name }}"$'\n'"$REPO:latest"
          elif [ "${{ github.ref_name }}" = "master" ]; then
            TAGS="$TAGS"$'\n'"$REPO:latest"
          elif [ "${{ github.ref_name }}" = "development" ]; then
            TAGS="$TAGS"$'\n'"$REPO:development"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
